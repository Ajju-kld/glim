<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Glim's orb, a sphere of flowing light, rising under the notch. Colours are the orb's
       listening palette from GlimOrbView. Softness comes from gradients, not filters, so
       AppKit's SVG renderer draws it the same at every icon size. -->
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1b6e"/>
      <stop offset="0.55" stop-color="#150f3d"/>
      <stop offset="1" stop-color="#0c3456"/>
    </linearGradient>
    <radialGradient id="topSheen" cx="0.5" cy="0.05" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auraViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#BF59FF" stop-opacity="0.75"/>
      <stop offset="0.55" stop-color="#4D73FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4D73FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auraCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#59F2FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#59F2FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auraPink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF73CC" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FF73CC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sphereBase" cx="0.45" cy="0.4" r="0.65">
      <stop offset="0" stop-color="#6a5cff"/>
      <stop offset="1" stop-color="#2b1f8f"/>
    </radialGradient>
    <radialGradient id="blobCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#59F2FF"/>
      <stop offset="0.6" stop-color="#59F2FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#59F2FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobPink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF73CC"/>
      <stop offset="0.6" stop-color="#FF73CC" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FF73CC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#BF59FF"/>
      <stop offset="0.6" stop-color="#BF59FF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#BF59FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobLight" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="depthShade" cx="0.42" cy="0.38" r="0.62">
      <stop offset="0.6" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.42"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
    <clipPath id="sphere">
      <circle cx="512" cy="560" r="250"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#background)"/>
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#topSheen)"/>

    <!-- Aura: the palette glowing behind the sphere -->
    <circle cx="512" cy="560" r="400" fill="url(#auraViolet)"/>
    <circle cx="400" cy="470" r="260" fill="url(#auraCyan)"/>
    <circle cx="630" cy="660" r="260" fill="url(#auraPink)"/>

    <!-- Sphere: colours flowing inside -->
    <g clip-path="url(#sphere)">
      <circle cx="512" cy="560" r="250" fill="url(#sphereBase)"/>
      <circle cx="420" cy="470" r="230" fill="url(#blobCyan)"/>
      <circle cx="650" cy="500" r="200" fill="url(#blobViolet)"/>
      <circle cx="600" cy="700" r="230" fill="url(#blobPink)"/>
      <circle cx="400" cy="690" r="150" fill="url(#blobCyan)" opacity="0.7"/>
      <circle cx="520" cy="570" r="120" fill="url(#blobLight)" opacity="0.5"/>
      <circle cx="512" cy="560" r="250" fill="url(#depthShade)"/>
    </g>

    <!-- Gloss highlight and rim -->
    <ellipse cx="430" cy="430" rx="110" ry="58" fill="url(#gloss)" transform="rotate(-32 430 430)"/>
    <circle cx="512" cy="560" r="247" fill="none" stroke="#ffffff" stroke-opacity="0.38" stroke-width="6"/>

    <!-- The notch the orb grows from -->
    <path d="M392 100 H632 V128 A36 36 0 0 1 596 164 H428 A36 36 0 0 1 392 128 Z" fill="#000000"/>
  </g>
</svg>
