<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Glim - local architecture loop</title>
  <desc id="desc">You speak, the local planner proposes, optional Laya may pick a control, Swift decides, then Glim acts. Nothing leaves the Mac.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0718"/>
      <stop offset="0.45" stop-color="#150f3d"/>
      <stop offset="1" stop-color="#0c2438"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0.18" cy="0.18" r="0.42">
      <stop offset="0" stop-color="#59F2FF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#59F2FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.84" cy="0.14" r="0.38">
      <stop offset="0" stop-color="#BF59FF" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#BF59FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowTeal" cx="0.72" cy="0.92" r="0.36">
      <stop offset="0" stop-color="#66FFBF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#66FFBF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#261a52"/>
      <stop offset="1" stop-color="#120c28"/>
    </linearGradient>
    <linearGradient id="optionalFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1760"/>
      <stop offset="1" stop-color="#120c28"/>
    </linearGradient>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 1.2 L9 5 L0 8.8 Z" fill="#59F2FF"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 1.2 L9 5 L0 8.8 Z" fill="#66FFBF"/>
    </marker>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#glowCyan)"/>
  <rect width="1920" height="1080" fill="url(#glowViolet)"/>
  <rect width="1920" height="1080" fill="url(#glowTeal)"/>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="96" y="112" fill="#f5f5f7" font-size="56" font-weight="700" letter-spacing="-1">Glim</text>
    <text x="96" y="158" fill="#c4bed8" font-size="24">Fully local architecture loop</text>

    <rect x="1396" y="80" width="428" height="62" rx="31" fill="#000" fill-opacity="0.38" stroke="#59F2FF" stroke-opacity="0.32"/>
    <circle cx="1436" cy="111" r="7" fill="#66FFBF"/>
    <text x="1458" y="120" fill="#eeeaf8" font-size="20" font-weight="500">Nothing leaves the Mac</text>

    <g>
      <rect x="96" y="236" width="320" height="280" rx="28" fill="url(#cardFill)" stroke="#59F2FF" stroke-opacity="0.42"/>
      <rect x="96" y="236" width="320" height="8" rx="4" fill="#59F2FF"/>
      <text x="128" y="292" fill="#59F2FF" font-size="15" font-weight="600" letter-spacing="2.6">01  SPEAK</text>
      <text x="128" y="354" fill="#ffffff" font-size="32" font-weight="700">Hold to talk</text>
      <text x="128" y="404" fill="#ddd8ee" font-size="22">Apple Speech</text>
      <text x="128" y="442" fill="#9a93b4" font-size="18">On-device / English</text>
    </g>

    <g>
      <rect x="448" y="236" width="320" height="280" rx="28" fill="url(#cardFill)" stroke="#F266FF" stroke-opacity="0.48"/>
      <rect x="448" y="236" width="320" height="8" rx="4" fill="#F266FF"/>
      <text x="480" y="292" fill="#F266FF" font-size="15" font-weight="600" letter-spacing="2.6">02  PLAN</text>
      <text x="480" y="354" fill="#ffffff" font-size="32" font-weight="700">qwen3-vl:4b</text>
      <text x="480" y="404" fill="#ddd8ee" font-size="22">Ollama proposes</text>
      <text x="480" y="442" fill="#9a93b4" font-size="18">Never acts</text>
    </g>

    <g>
      <rect x="800" y="236" width="320" height="280" rx="28" fill="url(#optionalFill)" stroke="#BF59FF" stroke-opacity="0.55" stroke-dasharray="8 7"/>
      <rect x="800" y="236" width="320" height="8" rx="4" fill="#BF59FF"/>
      <rect x="1004" y="266" width="92" height="28" rx="14" fill="#BF59FF" fill-opacity="0.18" stroke="#C98CFF" stroke-opacity="0.85"/>
      <text x="1018" y="285" fill="#E8C8FF" font-size="12" font-weight="700" letter-spacing="1.1">OPTIONAL</text>
      <text x="832" y="292" fill="#BF59FF" font-size="15" font-weight="600" letter-spacing="2.6">03  PICK</text>
      <text x="832" y="354" fill="#ffffff" font-size="32" font-weight="700">Laya</text>
      <text x="832" y="404" fill="#ddd8ee" font-size="22">Not required</text>
      <text x="832" y="442" fill="#9a93b4" font-size="18">Curiosity / else planner</text>
    </g>

    <g>
      <rect x="1152" y="236" width="320" height="280" rx="28" fill="url(#cardFill)" stroke="#FFC14D" stroke-opacity="0.5"/>
      <rect x="1152" y="236" width="320" height="8" rx="4" fill="#FFC14D"/>
      <text x="1184" y="292" fill="#FFC14D" font-size="15" font-weight="600" letter-spacing="2.6">04  GATE</text>
      <text x="1184" y="354" fill="#ffffff" font-size="32" font-weight="700">Swift</text>
      <text x="1184" y="404" fill="#ddd8ee" font-size="22">Code decides</text>
      <text x="1184" y="442" fill="#9a93b4" font-size="18">You approve if risky</text>
    </g>

    <g>
      <rect x="1504" y="236" width="320" height="280" rx="28" fill="url(#cardFill)" stroke="#66FFBF" stroke-opacity="0.5"/>
      <rect x="1504" y="236" width="320" height="8" rx="4" fill="#66FFBF"/>
      <text x="1536" y="292" fill="#66FFBF" font-size="15" font-weight="600" letter-spacing="2.6">05  ACT</text>
      <text x="1536" y="354" fill="#ffffff" font-size="32" font-weight="700">Click / type</text>
      <text x="1536" y="404" fill="#ddd8ee" font-size="22">Then next step</text>
      <text x="1536" y="442" fill="#9a93b4" font-size="18">Loop until done</text>
    </g>

    <line x1="416" y1="376" x2="444" y2="376" stroke="#59F2FF" stroke-width="3" marker-end="url(#arrowCyan)"/>
    <line x1="768" y1="376" x2="796" y2="376" stroke="#59F2FF" stroke-width="3" marker-end="url(#arrowCyan)"/>
    <line x1="1120" y1="376" x2="1148" y2="376" stroke="#59F2FF" stroke-width="3" marker-end="url(#arrowCyan)"/>
    <line x1="1472" y1="376" x2="1500" y2="376" stroke="#66FFBF" stroke-width="3" marker-end="url(#arrowTeal)"/>

    <path d="M1664 516 V630 H256 V516" fill="none" stroke="#66FFBF" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrowTeal)"/>
    <rect x="780" y="606" width="360" height="48" rx="24" fill="#0b0718"/>
    <text x="960" y="638" text-anchor="middle" fill="#66FFBF" font-size="18" font-weight="600" letter-spacing="1.6">NEXT STEP  /  SAME TASK</text>

    <text x="960" y="820" text-anchor="middle" fill="#f5f5f7" font-size="32" font-weight="600">The AI proposes. Code decides. You approve.</text>
    <text x="960" y="868" text-anchor="middle" fill="#8e88a6" font-size="20">qwen3-vl on Ollama  /  Apple Speech  /  Laya optional  /  Jev off</text>
  </g>
</svg>
